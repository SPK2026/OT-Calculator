<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OT Calculator Hub</title>
  <!-- Tailwind CSS & Confetti Library -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
    
    html, body {
      font-family: 'Inter', sans-serif;
      overscroll-behavior: none;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      margin: 0;
      padding: 0;
    }

    /* Floating Rupee Background Animation */
    .rupee-bg {
      position: absolute;
      color: rgba(56, 189, 248, 0.08);
      font-weight: 800;
      user-select: none;
      pointer-events: none;
      animation: floatRupee linear infinite alternate;
    }

    @keyframes floatRupee {
      0% {
        transform: translateY(0px) rotate(0deg) scale(1);
      }
      50% {
        transform: translateY(-20px) rotate(8deg) scale(1.04);
      }
      100% {
        transform: translateY(-40px) rotate(-8deg) scale(1.08);
      }
    }

    /* Slow Duck Walking & Hopping Across Screen */
    @keyframes slowWalkAcross {
      0% {
        transform: translate(-100px, -20px) scale(0.75);
        opacity: 0;
      }
      10% {
        opacity: 0.85;
      }
      85% {
        opacity: 0.85;
      }
      100% {
        transform: translate(calc(100vw + 100px), 18vh) scale(1.05);
        opacity: 0;
      }
    }

    /* Up-and-Down Hopping & Waddling Stepping Motion */
    @keyframes duckWaddleHop {
      0% {
        transform: translateY(0px) rotate(-10deg);
      }
      25% {
        transform: translateY(-16px) rotate(0deg) scaleY(1.05);
      }
      50% {
        transform: translateY(2px) rotate(10deg);
      }
      75% {
        transform: translateY(-16px) rotate(0deg) scaleY(1.05);
      }
      100% {
        transform: translateY(0px) rotate(-10deg);
      }
    }

    .duck-fly-overlay {
      position: fixed;
      top: 15%;
      left: 0;
      z-index: 50;
      pointer-events: none; /* Never blocks input clicks */
      display: flex;
      flex-direction: column;
      align-items: center;
      opacity: 0;
    }

    .duck-fly-active {
      animation: slowWalkAcross 11s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }

    .duck-body {
      animation: duckWaddleHop 0.9s ease-in-out infinite;
      filter: drop-shadow(0 12px 18px rgba(0, 0, 0, 0.4));
    }

    /* Dynamic Result Animations */
    .smile-bounce {
      display: inline-block;
      animation: bounce 0.8s infinite alternate ease-in-out;
    }
    .smile-spin {
      display: inline-block;
      animation: spinPulse 1.2s infinite ease-in-out;
    }

    @keyframes bounce {
      0% { transform: translateY(0); }
      100% { transform: translateY(-8px); }
    }

    @keyframes spinPulse {
      0% { transform: scale(0.8) rotate(-10deg); }
      50% { transform: scale(1.2) rotate(10deg); }
      100% { transform: scale(0.8) rotate(-10deg); }
    }

    .pop-anim {
      animation: popEffect 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .blink-anim {
      animation: blinkEffect 1s infinite alternate;
    }

    @keyframes popEffect {
      0% { transform: scale(0.97); }
      50% { transform: scale(1.02); }
      100% { transform: scale(1); }
    }

    @keyframes blinkEffect {
      0% { color: #38bdf8; text-shadow: 0 0 8px rgba(56, 189, 248, 0.4); }
      100% { color: #4ade80; text-shadow: 0 0 20px rgba(74, 222, 128, 0.8); }
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 h-screen w-screen overflow-hidden flex items-center justify-center p-3 sm:p-5 select-none relative">

  <div id="rupeeBgContainer" class="absolute inset-0 overflow-hidden pointer-events-none z-0">
    <div class="rupee-bg text-6xl sm:text-8xl" style="top: 6%; left: 4%; animation-duration: 8s;">₹</div>
    <div class="rupee-bg text-7xl sm:text-9xl" style="top: 12%; right: 6%; animation-duration: 10s; animation-delay: -2s;">₹</div>
    <div class="rupee-bg text-8xl sm:text-[11rem]" style="bottom: 8%; left: 6%; animation-duration: 9s; animation-delay: -4s;">₹</div>
    <div class="rupee-bg text-6xl sm:text-8xl" style="bottom: 10%; right: 10%; animation-duration: 11s; animation-delay: -1s;">₹</div>
    <div class="rupee-bg text-5xl sm:text-7xl" style="top: 42%; left: 2%; animation-duration: 7s; animation-delay: -3s;">₹</div>
    <div class="rupee-bg text-5xl sm:text-7xl" style="top: 45%; right: 3%; animation-duration: 12s; animation-delay: -5s;">₹</div>
    <div class="rupee-bg text-7xl sm:text-9xl" style="top: 2%; left: 42%; animation-duration: 9s; animation-delay: -2s;">₹</div>
    <div class="rupee-bg text-8xl sm:text-[10rem]" style="bottom: 2%; left: 40%; animation-duration: 10s; animation-delay: -6s;">₹</div>
  </div>

  <div id="zeroDuckContainer" class="duck-fly-overlay hidden">
    <div class="relative flex flex-col items-center opacity-80 hover:opacity-100 transition-opacity">
      <!-- Speech bubble -->
      <div class="bg-amber-400 text-slate-950 text-xs sm:text-sm font-black px-3.5 py-1.5 rounded-2xl rounded-bl-none shadow-xl mb-1 whitespace-nowrap border-2 border-amber-300">
        ₹0 Overtime? Quack! 🦆
      </div>
      <!-- Waddling & Hopping Duck Vector SVG -->
      <svg class="duck-body w-28 h-28 sm:w-36 sm:h-36 opacity-85" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
        <!-- Body -->
        <ellipse cx="50" cy="60" rx="32" ry="24" fill="#FACC15"/>
        <!-- Tail Feather -->
        <path d="M 20 58 Q 10 50 14 42 Q 24 50 26 56 Z" fill="#EAB308"/>
        <!-- Wing -->
        <path d="M 40 55 C 32 55 28 68 42 72 C 55 75 58 60 40 55 Z" fill="#CA8A04"/>
        <!-- Head -->
        <circle cx="70" cy="36" r="18" fill="#FACC15"/>
        <!-- Beak -->
        <path d="M 82 34 Q 98 36 86 44 Z" fill="#F97316"/>
        <!-- Eye -->
        <circle cx="74" cy="32" r="3.5" fill="#0F172A"/>
        <circle cx="75.5" cy="30.5" r="1.2" fill="#FFFFFF"/>
        <!-- Cheek blush -->
        <circle cx="72" cy="40" r="4" fill="#F43F5E" opacity="0.6"/>
        <!-- Left Foot -->
        <path d="M 45 80 L 42 90 M 42 90 L 36 92 M 42 90 L 48 92" stroke="#F97316" stroke-width="4" stroke-linecap="round"/>
        <!-- Right Foot -->
        <path d="M 58 80 L 62 90 M 62 90 L 56 92 M 62 90 L 68 92" stroke="#EA580C" stroke-width="4" stroke-linecap="round"/>
      </svg>
    </div>
  </div>

  <div class="relative z-10 bg-slate-900/95 backdrop-blur-md border-2 border-sky-400/80 rounded-2xl p-4 sm:p-5 w-full max-w-2xl md:max-w-3xl flex flex-col justify-between shadow-[0_0_50px_rgba(56,189,248,0.25)]">
    
    <!-- Tab Controls -->
    <div class="grid grid-cols-2 gap-2.5 mb-3">
      <button id="btnTabBonanza" onclick="switchTab('bonanza')" class="py-2.5 px-4 rounded-xl font-extrabold text-xs sm:text-base transition-all duration-300 bg-sky-400 text-slate-950 shadow-lg shadow-sky-400/30">
        OT Bonanza
      </button>
      <button id="btnTabRegular" onclick="switchTab('regular')" class="py-2.5 px-4 rounded-xl font-extrabold text-xs sm:text-base transition-all duration-300 bg-slate-950/80 text-slate-400 border border-slate-700 hover:text-slate-200">
        Regular OT
      </button>
    </div>

    <!-- TAB 1: OT BONANZA -->
    <div id="tabBonanza" class="flex flex-col space-y-3">
      <div class="text-center">
        <h1 class="text-sky-400 font-extrabold text-base sm:text-2xl tracking-wider uppercase">October OT Bonanza</h1>
        <p class="text-slate-300 text-[11px] sm:text-xs font-semibold mt-0.5">STAY ACCURATE, BOOST CSAT, EARN BIG!</p>
      </div>

      <!-- Input Grid -->
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1">MTD Calls / Chats</label>
          <input type="number" id="b_callCount" placeholder="0" min="0" oninput="updateTotal('b')"
            class="w-full bg-slate-950 border border-slate-700 focus:border-sky-400 rounded-xl px-3 py-2 text-xs sm:text-sm text-white outline-none transition">
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1">MTD Emails (3 emails = 2 chats)</label>
          <input type="number" id="b_emailCount" placeholder="0" min="0" oninput="updateTotal('b')"
            class="w-full bg-slate-950 border border-slate-700 focus:border-sky-400 rounded-xl px-3 py-2 text-xs sm:text-sm text-white outline-none transition">
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1">Total Equivalent (Auto)</label>
          <input type="number" id="b_total" placeholder="0.00" readonly
            class="w-full bg-slate-950/80 border border-sky-500/50 rounded-xl px-3 py-2 text-xs sm:text-sm text-sky-400 font-bold outline-none">
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1">CSAT Percentage (%)</label>
          <input type="number" id="b_csat" placeholder="Min required: 62%" min="0" max="100"
            class="w-full bg-slate-950 border border-slate-700 focus:border-sky-400 rounded-xl px-3 py-2 text-xs sm:text-sm text-white outline-none transition">
        </div>
      </div>

      <!-- Unsaved Error Checkbox -->
      <div class="bg-slate-950/70 border border-slate-800 rounded-xl p-2 flex items-center gap-3">
        <input type="checkbox" id="b_unsavedError" class="w-4 h-4 accent-sky-400 cursor-pointer">
        <label for="b_unsavedError" class="text-xs font-medium text-slate-200 cursor-pointer">
          More than 1 unsaved error
        </label>
      </div>

      <!-- Calculate Button -->
      <button onclick="calculateBonanza()" class="w-full bg-sky-400 hover:bg-sky-300 active:scale-[0.99] text-slate-950 font-black text-xs sm:text-sm py-2.5 sm:py-3 rounded-xl transition shadow-lg shadow-sky-400/20 uppercase tracking-wide">
        Calculate Bonanza
      </button>

      <!-- Result Card -->
      <div id="b_resultBox" class="bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-center relative flex flex-col justify-center min-h-[85px]">
        <span class="text-slate-400 text-[11px] font-medium uppercase tracking-wider">Estimated Bonanza Payout</span>
        <div id="b_payout" class="text-2xl sm:text-3xl font-extrabold text-sky-400 my-0.5">₹ 0</div>
        <p id="b_details" class="text-slate-300 text-xs">Enter metrics to calculate.</p>
        <div id="b_smileBox" class="absolute top-2 right-3 text-xl sm:text-2xl"></div>
      </div>
    </div>

    <!-- TAB 2: REGULAR OT -->
    <div id="tabRegular" class="hidden flex-col space-y-3">
      <div class="text-center">
        <h1 class="text-sky-400 font-extrabold text-base sm:text-2xl tracking-wider uppercase">Regular Overtime</h1>
        <p class="text-slate-300 text-[11px] sm:text-xs font-semibold mt-0.5">SELECT SHIFT TYPES & ENTER DAYS</p>
      </div>

      <!-- Daily Averages -->
      <div class="grid grid-cols-1 sm:grid-cols-3 gap-2.5">
        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1">Daily Avg Calls / Chats</label>
          <input type="number" id="r_callCount" placeholder="0" min="0" oninput="updateTotal('r')"
            class="w-full bg-slate-950 border border-slate-700 focus:border-sky-400 rounded-xl px-3 py-2 text-xs sm:text-sm text-white outline-none transition">
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1">Daily Avg Emails (3e = 2c)</label>
          <input type="number" id="r_emailCount" placeholder="0" min="0" oninput="updateTotal('r')"
            class="w-full bg-slate-950 border border-slate-700 focus:border-sky-400 rounded-xl px-3 py-2 text-xs sm:text-sm text-white outline-none transition">
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1">Daily Equivalent (Auto)</label>
          <input type="number" id="r_total" placeholder="0.00" readonly
            class="w-full bg-slate-950/80 border border-sky-500/50 rounded-xl px-3 py-2 text-xs sm:text-sm text-sky-400 font-bold outline-none">
        </div>
      </div>

      <!-- Shift Options Grid -->
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
        <!-- Regular Workday Option -->
        <div class="bg-slate-950/70 border border-slate-800 rounded-xl p-2.5 flex flex-col justify-between">
          <div class="flex items-center gap-2">
            <input type="checkbox" id="r_chkWorkday" onchange="toggleDaysInput('r_daysWorkdayContainer')" class="w-4 h-4 accent-sky-400 cursor-pointer">
            <label for="r_chkWorkday" class="text-xs font-semibold text-slate-200 cursor-pointer">
              Regular Workday OT <span class="text-sky-400 text-[10px] block font-normal">(Threshold: 45 chats)</span>
            </label>
          </div>
          <div id="r_daysWorkdayContainer" class="hidden mt-1.5">
            <label class="block text-[11px] text-slate-400 mb-1">Number of Workdays:</label>
            <input type="number" id="r_daysWorkday" value="1" min="1"
              class="w-full bg-slate-900 border border-slate-700 rounded-lg px-2.5 py-1 text-xs text-white outline-none">
          </div>
        </div>

        <!-- Week Off Option -->
        <div class="bg-slate-950/70 border border-slate-800 rounded-xl p-2.5 flex flex-col justify-between">
          <div class="flex items-center gap-2">
            <input type="checkbox" id="r_chkWeekoff" onchange="toggleDaysInput('r_daysWeekoffContainer')" class="w-4 h-4 accent-sky-400 cursor-pointer">
            <label for="r_chkWeekoff" class="text-xs font-semibold text-slate-200 cursor-pointer">
              6th Day / Week Off <span class="text-sky-400 text-[10px] block font-normal">(Paid from 1st chat)</span>
            </label>
          </div>
          <div id="r_daysWeekoffContainer" class="hidden mt-1.5">
            <label class="block text-[11px] text-slate-400 mb-1">Number of Week Off Days:</label>
            <input type="number" id="r_daysWeekoff" value="1" min="1"
              class="w-full bg-slate-900 border border-slate-700 rounded-lg px-2.5 py-1 text-xs text-white outline-none">
          </div>
        </div>
      </div>

      <!-- Calculate Button -->
      <button onclick="calculateRegular()" class="w-full bg-sky-400 hover:bg-sky-300 active:scale-[0.99] text-slate-950 font-black text-xs sm:text-sm py-2.5 sm:py-3 rounded-xl transition shadow-lg shadow-sky-400/20 uppercase tracking-wide">
        Calculate Regular OT
      </button>

      <!-- Result Card -->
      <div id="r_resultBox" class="bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-center relative flex flex-col justify-center min-h-[85px]">
        <span class="text-slate-400 text-[11px] font-medium uppercase tracking-wider">Estimated Regular OT Payout</span>
        <div id="r_payout" class="text-2xl sm:text-3xl font-extrabold text-sky-400 my-0.5">₹ 0</div>
        <p id="r_details" class="text-slate-300 text-xs">Select shift type & enter days to calculate.</p>
        <div id="r_smileBox" class="absolute top-2 right-3 text-xl sm:text-2xl"></div>
      </div>
    </div>

  </div>

  <script>
    // Tab switching handler
    function switchTab(tabName) {
      const bBtn = document.getElementById('btnTabBonanza');
      const rBtn = document.getElementById('btnTabRegular');
      const bTab = document.getElementById('tabBonanza');
      const rTab = document.getElementById('tabRegular');

      if (tabName === 'bonanza') {
        bBtn.className = "py-2.5 px-4 rounded-xl font-extrabold text-xs sm:text-base transition-all duration-300 bg-sky-400 text-slate-950 shadow-lg shadow-sky-400/30";
        rBtn.className = "py-2.5 px-4 rounded-xl font-extrabold text-xs sm:text-base transition-all duration-300 bg-slate-950/80 text-slate-400 border border-slate-700 hover:text-slate-200";
        bTab.classList.remove('hidden');
        bTab.classList.add('flex');
        rTab.classList.add('hidden');
        rTab.classList.remove('flex');
      } else {
        rBtn.className = "py-2.5 px-4 rounded-xl font-extrabold text-xs sm:text-base transition-all duration-300 bg-sky-400 text-slate-950 shadow-lg shadow-sky-400/30";
        bBtn.className = "py-2.5 px-4 rounded-xl font-extrabold text-xs sm:text-base transition-all duration-300 bg-slate-950/80 text-slate-400 border border-slate-700 hover:text-slate-200";
        rTab.classList.remove('hidden');
        rTab.classList.add('flex');
        bTab.classList.add('hidden');
        bTab.classList.remove('flex');
      }
    }

    // Toggle sub-inputs for days
    function toggleDaysInput(containerId) {
      const container = document.getElementById(containerId);
      const checkbox = container.parentElement.querySelector('input[type="checkbox"]');
      container.style.display = checkbox.checked ? 'block' : 'none';
    }

    // Auto sum conversion calculation
    function updateTotal(prefix) {
      const calls = parseFloat(document.getElementById(prefix + '_callCount').value) || 0;
      const emails = parseFloat(document.getElementById(prefix + '_emailCount').value) || 0;
      const totalVolume = calls + (emails * (2 / 3));
      document.getElementById(prefix + '_total').value = totalVolume.toFixed(2);
    }

    // Handle flying duck & positive payout animations
    function handleAnimations(boxId, amountId, smileBoxId, totalAmount) {
      const box = document.getElementById(boxId);
      const amountEl = document.getElementById(amountId);
      const smileBox = document.getElementById(smileBoxId);
      const duckContainer = document.getElementById('zeroDuckContainer');

      box.classList.remove('pop-anim');
      amountEl.classList.remove('blink-anim');
      smileBox.innerHTML = "";

      if (totalAmount > 0) {
        // Hide duck when payout is greater than 0
        duckContainer.classList.add('hidden');
        duckContainer.classList.remove('duck-fly-active');

        void box.offsetWidth;
        box.classList.add('pop-anim');
        amountEl.classList.add('blink-anim');

        let smileHTML = "";
        if (totalAmount > 20000) {
          smileHTML = `<span class="smile-spin">🤩🤑🎉</span>`;
          if (typeof confetti === 'function') {
            confetti({ particleCount: 120, spread: 80, origin: { y: 0.6 } });
          }
        } else if (totalAmount > 5000) {
          smileHTML = `<span class="smile-bounce">😄⭐</span>`;
        } else {
          smileHTML = `<span class="smile-bounce">🙂</span>`;
        }
        smileBox.innerHTML = smileHTML;
      } else {
        // Trigger slow waddling/hopping duck overlay when payout is zero
        duckContainer.classList.remove('hidden');
        duckContainer.classList.remove('duck-fly-active');
        void duckContainer.offsetWidth;
        duckContainer.classList.add('duck-fly-active');
      }
    }

    // Calculate OT Bonanza Scheme
    function calculateBonanza() {
      const calls = parseFloat(document.getElementById('b_callCount').value) || 0;
      const emails = parseFloat(document.getElementById('b_emailCount').value) || 0;
      const csat = parseFloat(document.getElementById('b_csat').value) || 0;
      const hasUnsavedError = document.getElementById('b_unsavedError').checked;

      const totalVolume = calls + (emails * (2 / 3));
      document.getElementById('b_total').value = totalVolume.toFixed(2);

      const rateTier1 = 22400 / 1270;
      const rateTier2 = 35000 / 1340;
      const rateTier3 = 45000 / 1390;

      let appliedRate = 0;
      let totalPayout = 0;
      let note = "";

      const meetsRiderConditions = (csat >= 62) && (!hasUnsavedError);

      if (totalVolume < 1270) {
        document.getElementById('b_payout').innerText = "₹ 0";
        document.getElementById('b_details').innerText = "Min 1270 transactions required for Bonanza tier.";
        handleAnimations('b_resultBox', 'b_payout', 'b_smileBox', 0);
        return;
      }

      if (meetsRiderConditions) {
        if (totalVolume >= 1390) {
          appliedRate = rateTier3;
          note = `Tier 3 rate applied (₹${appliedRate.toFixed(2)}/unit for ${totalVolume.toFixed(2)} units).`;
        } else if (totalVolume >= 1340) {
          appliedRate = rateTier2;
          note = `Tier 2 rate applied (₹${appliedRate.toFixed(2)}/unit for ${totalVolume.toFixed(2)} units).`;
        } else {
          appliedRate = rateTier1;
          note = `Tier 1 rate applied (₹${appliedRate.toFixed(2)}/unit for ${totalVolume.toFixed(2)} units).`;
        }
        totalPayout = totalVolume * appliedRate;
      } else {
        totalPayout = 0;
        let reasons = [];
        if (csat < 62) reasons.push("CSAT < 62%");
        if (hasUnsavedError) reasons.push(">1 unsaved error");
        note = `Criteria missed due to ${reasons.join(" and ")}.`;
      }

      document.getElementById('b_payout').innerText = "₹ " + totalPayout.toLocaleString('en-IN', { maximumFractionDigits: 2 });
      document.getElementById('b_details').innerText = note;

      handleAnimations('b_resultBox', 'b_payout', 'b_smileBox', totalPayout);
    }

    // Calculate Regular OT
    function calculateRegular() {
      const calls = parseFloat(document.getElementById('r_callCount').value) || 0;
      const emails = parseFloat(document.getElementById('r_emailCount').value) || 0;

      const isWorkdayChecked = document.getElementById('r_chkWorkday').checked;
      const isWeekoffChecked = document.getElementById('r_chkWeekoff').checked;

      const workdayDays = parseFloat(document.getElementById('r_daysWorkday').value) || 0;
      const weekoffDays = parseFloat(document.getElementById('r_daysWeekoff').value) || 0;

      const dailyVolume = calls + (emails * (2 / 3));
      document.getElementById('r_total').value = dailyVolume.toFixed(2);

      if (!isWorkdayChecked && !isWeekoffChecked) {
        document.getElementById('r_payout').innerText = "₹ 0";
        document.getElementById('r_details').innerText = "Please check at least one OT option.";
        handleAnimations('r_resultBox', 'r_payout', 'r_smileBox', 0);
        return;
      }

      let totalPayout = 0;
      let summaryNotes = [];

      if (isWorkdayChecked) {
        if (dailyVolume <= 45) {
          summaryNotes.push(`Workdays (${workdayDays}d): ₹0 (Volume ≤ 45 threshold)`);
        } else {
          const payablePerDay = dailyVolume - 45;
          const workdayPayout = payablePerDay * 65 * workdayDays;
          totalPayout += workdayPayout;
          summaryNotes.push(`Workdays (${workdayDays}d): ₹${workdayPayout.toFixed(2)} (${payablePerDay.toFixed(2)} extra chats/d @ ₹65)`);
        }
      }

      if (isWeekoffChecked) {
        const weekoffPayout = dailyVolume * 65 * weekoffDays;
        totalPayout += weekoffPayout;
        summaryNotes.push(`Week Off (${weekoffDays}d): ₹${weekoffPayout.toFixed(2)} (${dailyVolume.toFixed(2)} chats/d @ ₹65 from 1st chat)`);
      }

      document.getElementById('r_payout').innerText = "₹ " + totalPayout.toLocaleString('en-IN', { maximumFractionDigits: 2 });
      document.getElementById('r_details').innerText = summaryNotes.join(" | ");

      handleAnimations('r_resultBox', 'r_payout', 'r_smileBox', totalPayout);
    }
  </script>
</body>
</html>
