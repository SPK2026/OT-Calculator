    /* Waddle Animation */
    @keyframes duckWaddle {
      0%, 100% { transform: rotate(-8deg) translateY(0); }

    /* Trajectory animation from top-left corner to calculation box */
    @keyframes drawTrajectory {
      0% {
        top: 2%;
        left: 2%;
        opacity: 0;
        transform: scale(0.6);
      }
      10% {
        opacity: 1;
      }
      90% {
        opacity: 1;
      }
      100% {
        top: min(65vh, 480px);
        left: min(50vw, 400px);
        opacity: 0.95;
        transform: scale(1);
      }
    }

    .duck-walk-container {
      position: fixed;
      z-index: 40;
      pointer-events: none;
      animation: drawTrajectory 8s ease-in-out infinite alternate;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .duck-body {
      animation: duckWaddle 0.6s ease-in-out infinite;
