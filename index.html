<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OT Calculator Hub</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #0b192c;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }
    .calculator-card {
      background-color: #1e293b;
      border: 2px solid #38bdf8;
      border-radius: 12px;
      padding: 25px;
      max-width: 480px;
      width: 100%;
      box-shadow: 0 8px 24px rgba(56, 189, 248, 0.2);
    }
    /* Tab Styling */
    .tab-container {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }
    .tab-btn {
      flex: 1;
      padding: 12px;
      background-color: #0f172a;
      color: #94a3b8;
      border: 1px solid #334155;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      text-align: center;
      transition: all 0.3s ease;
    }
    .tab-btn.active {
      background-color: #38bdf8;
      color: #0f172a;
      border-color: #38bdf8;
    }
    .tab-content {
      display: none;
    }
    .tab-content.active {
      display: block;
    }

    h2 {
      text-align: center;
      color: #38bdf8;
      margin-top: 0;
      text-transform: uppercase;
      letter-spacing: 1px;
      font-size: 1.3rem;
    }
    .subtitle {
      text-align: center;
      color: #cbd5e1;
      font-size: 0.85em;
      margin-bottom: 20px;
      font-weight: bold;
    }
    .form-group {
      margin-bottom: 15px;
    }
    label {
      display: block;
      margin-bottom: 6px;
      font-weight: 600;
      color: #e2e8f0;
      font-size: 0.9rem;
    }
    input[type="number"] {
      width: 100%;
      padding: 10px;
      border-radius: 6px;
      border: 1px solid #475569;
      background-color: #0f172a;
      color: #fff;
      font-size: 0.95rem;
      box-sizing: border-box;
    }
    input[type="number"]:focus {
      border-color: #38bdf8;
      outline: none;
    }
    input[readonly] {
      background-color: #1e293b;
      border-color: #38bdf8;
      color: #38bdf8;
      font-weight: bold;
    }
    
    /* Checkbox & Options Card */
    .option-card {
      background: #0f172a;
      border: 1px solid #334155;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 12px;
    }
    .checkbox-group {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .checkbox-group input {
      width: 18px;
      height: 18px;
      accent-color: #38bdf8;
      cursor: pointer;
    }
    .days-input {
      margin-top: 10px;
      display: none;
    }

    .calc-btn {
      width: 100%;
      padding: 12px;
      background-color: #38bdf8;
      color: #0f172a;
      border: none;
      border-radius: 6px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      margin-top: 15px;
      transition: background 0.2s;
    }
    .calc-btn:hover {
      background-color: #0284c7;
      color: #ffffff;
    }

    /* Output Result Box */
    .result-box {
      margin-top: 20px;
      padding: 15px;
      border-radius: 8px;
      background-color: #0f172a;
      text-align: center;
      border: 1px solid #334155;
      transition: transform 0.3s ease;
    }
    .result-title {
      font-size: 0.85em;
      color: #94a3b8;
    }
    .result-amount {
      font-size: 1.8rem;
      font-weight: bold;
      color: #38bdf8;
      margin: 6px 0;
    }
    .result-reason {
      font-size: 0.8em;
      color: #cbd5e1;
    }

    /* Pop & Blink Animations */
    .pop-anim {
      animation: popEffect 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .blink-anim {
      animation: blinkEffect 1.2s infinite alternate;
    }

    @keyframes popEffect {
      0% { transform: scale(0.9); }
      50% { transform: scale(1.05); }
      100% { transform: scale(1); }
    }

    @keyframes blinkEffect {
      0% { color: #38bdf8; text-shadow: 0 0 5px rgba(56, 189, 248, 0.5); }
      100% { color: #4ade80; text-shadow: 0 0 15px rgba(74, 222, 128, 0.9); }
    }
  </style>
</head>
<body>

<div class="calculator-card">
  <!-- Tab Navigation -->
  <div class="tab-container">
    <div class="tab-btn active" onclick="switchTab('bonanza')">OT Bonanza</div>
    <div class="tab-btn" onclick="switchTab('regular')">Regular OT</div>
  </div>

  <!-- OT BONANZA SECTION -->
  <div id="bonanzaTab" class="tab-content active">
    <h2>October OT Bonanza</h2>
    <div class="subtitle">STAY ACCURATE, BOOST CSAT, EARN BIG!</div>

    <div class="form-group">
      <label for="b_callCount">MTD Call/Chat Count:</label>
      <input type="number" id="b_callCount" placeholder="Enter chats/calls" min="0" oninput="updateTotal('b')">
    </div>

    <div class="form-group">
      <label for="b_emailCount">MTD Email Count (3 Emails = 2 Chats):</label>
      <input type="number" id="b_emailCount" placeholder="Enter emails" min="0" oninput="updateTotal('b')">
    </div>

    <div class="form-group">
      <label for="b_total">Total Equivalent Transactions (Auto):</label>
      <input type="number" id="b_total" placeholder="0" readonly>
    </div>

    <div class="form-group">
      <label for="b_csat">CSAT Percentage (%):</label>
      <input type="number" id="b_csat" placeholder="Min. CSAT required: 62%" min="0" max="100">
    </div>

    <div class="form-group option-card">
      <div class="checkbox-group">
        <input type="checkbox" id="b_unsavedError">
        <label for="b_unsavedError">More than 1 unsaved error</label>
      </div>
    </div>

    <button class="calc-btn" onclick="calculateBonanza()">Calculate Bonanza Earnings</button>

    <div class="result-box" id="b_resultBox">
      <div class="result-title">Estimated Bonanza Payout</div>
      <div class="result-amount" id="b_payout">₹ 0</div>
      <div class="result-reason" id="b_details">Enter metrics to calculate.</div>
    </div>
  </div>

  <!-- REGULAR OT SECTION -->
  <div id="regularTab" class="tab-content">
    <h2>Regular Overtime</h2>
    <div class="subtitle">SELECT SHIFT TYPES & DAYS</div>

    <div class="form-group">
      <label for="r_callCount">Daily Average Call/Chat Count:</label>
      <input type="number" id="r_callCount" placeholder="Enter chats/calls" min="0" oninput="updateTotal('r')">
    </div>

    <div class="form-group">
      <label for="r_emailCount">Daily Average Email Count (3 Emails = 2 Chats):</label>
      <input type="number" id="r_emailCount" placeholder="Enter emails" min="0" oninput="updateTotal('r')">
    </div>

    <div class="form-group">
      <label for="r_total">Daily Equivalent Transactions (Auto):</label>
      <input type="number" id="r_total" placeholder="0" readonly>
    </div>

    <!-- Regular Workday Option -->
    <div class="option-card">
      <div class="checkbox-group">
        <input type="checkbox" id="r_chkWorkday" onchange="toggleDaysInput('r_daysWorkdayContainer')">
        <label for="r_chkWorkday">Regular Workday OT (Min Threshold: 45)</label>
      </div>
      <div class="days-input" id="r_daysWorkdayContainer">
        <label for="r_daysWorkday">Number of Workdays:</label>
        <input type="number" id="r_daysWorkday" value="1" min="1" placeholder="Enter days">
      </div>
    </div>

    <!-- 6th Day / Week Off Option -->
    <div class="option-card">
      <div class="checkbox-group">
        <input type="checkbox" id="r_chkWeekoff" onchange="toggleDaysInput('r_daysWeekoffContainer')">
        <label for="r_chkWeekoff">6th Day Working / Week Off (From 1st Chat)</label>
      </div>
      <div class="days-input" id="r_daysWeekoffContainer">
        <label for="r_daysWeekoff">Number of Week Off Days:</label>
        <input type="number" id="r_daysWeekoff" value="1" min="1" placeholder="Enter days">
      </div>
    </div>

    <button class="calc-btn" onclick="calculateRegular()">Calculate Regular OT</button>

    <div class="result-box" id="r_resultBox">
      <div class="result-title">Estimated Regular OT Payout</div>
      <div class="result-amount" id="r_payout">₹ 0</div>
      <div class="result-reason" id="r_details">Select shift type & enter days to calculate.</div>
    </div>
  </div>
</div>

<script>
// Tab Switcher
function switchTab(tabName) {
  const tabs = document.querySelectorAll('.tab-btn');
  const contents = document.querySelectorAll('.tab-content');

  tabs.forEach(tab => tab.classList.remove('active'));
  contents.forEach(content => content.classList.remove('active'));

  if (tabName === 'bonanza') {
    tabs[0].classList.add('active');
    document.getElementById('bonanzaTab').classList.add('active');
  } else {
    tabs[1].classList.add('active');
    document.getElementById('regularTab').classList.add('active');
  }
}

// Toggle Visibility of Days Inputs
function toggleDaysInput(containerId) {
  const container = document.getElementById(containerId);
  const checkbox = container.previousElementSibling.querySelector('input[type="checkbox"]');
  container.style.display = checkbox.checked ? 'block' : 'none';
}

// Auto Update Transactions Volume
function updateTotal(prefix) {
  const calls = parseInt(document.getElementById(prefix + '_callCount').value) || 0;
  const emails = parseInt(document.getElementById(prefix + '_emailCount').value) || 0;
  const totalVolume = calls + (emails * (2 / 3));
  document.getElementById(prefix + '_total').value = totalVolume.toFixed(2);
}

// Helper to Trigger Pop & Blink Effect
function triggerPayoutAnimation(boxId, amountId, totalAmount) {
  const box = document.getElementById(boxId);
  const amountEl = document.getElementById(amountId);

  // Reset animations
  box.classList.remove('pop-anim');
  amountEl.classList.remove('blink-anim');

  if (totalAmount > 0) {
    // Trigger pop effect on container
    void box.offsetWidth; 
    box.classList.add('pop-anim');
    
    // Add glowing blink effect to positive text
    amountEl.classList.add('blink-anim');
  }
}

// OT Bonanza Logic
function calculateBonanza() {
  const calls = parseInt(document.getElementById('b_callCount').value) || 0;
  const emails = parseInt(document.getElementById('b_emailCount').value) || 0;
  const csat = parseFloat(document.getElementById('b_csat').value) || 0;
  const hasUnsavedError = document.getElementById('b_unsavedError').checked;

  const totalVolume = calls + (emails * (2 / 3));
  document.getElementById('b_total').value = totalVolume.toFixed(2);

  const rateTier1 = 22400 / 1270;
  const rateTier2 = 35000 / 1340;
  const rateTier3 = 45000 / 1390;

  let appliedRate = 0;
  let totalPayout = 0;
  let calculationNote = "";

  const meetsRiderConditions = (csat >= 62) && (!hasUnsavedError);

  if (totalVolume < 1270) {
    document.getElementById('b_payout').innerText = "₹ 0";
    document.getElementById('b_details').innerText = `₹0 Payout: Minimum 1270 transactions required for Bonanza tier.`;
    triggerPayoutAnimation('b_resultBox', 'b_payout', 0);
    return;
  }

  if (meetsRiderConditions) {
    if (totalVolume >= 1390) {
      appliedRate = rateTier3;
      calculationNote = `Tier 3 rate applied (₹${appliedRate.toFixed(3)}/unit for ${totalVolume.toFixed(2)} units).`;
    } else if (totalVolume >= 1340) {
      appliedRate = rateTier2;
      calculationNote = `Tier 2 rate applied (₹${appliedRate.toFixed(3)}/unit for ${totalVolume.toFixed(2)} units).`;
    } else {
      appliedRate = rateTier1;
      calculationNote = `Tier 1 rate applied (₹${appliedRate.toFixed(3)}/unit for ${totalVolume.toFixed(2)} units).`;
    }
    totalPayout = totalVolume * appliedRate;
  } else {
    totalPayout = 0;
    let reasonText = [];
    if (csat < 62) reasonText.push("CSAT is below 62%");
    if (hasUnsavedError) reasonText.push("More than 1 unsaved error");
    calculationNote = `₹0 Payout: Criteria missed due to ${reasonText.join(" and ")}.`;
  }

  document.getElementById('b_payout').innerText = "₹ " + totalPayout.toLocaleString('en-IN', { maximumFractionDigits: 2 });
  document.getElementById('b_details').innerText = calculationNote;

  triggerPayoutAnimation('b_resultBox', 'b_payout', totalPayout);
}

// Regular OT Logic
function calculateRegular() {
  const calls = parseInt(document.getElementById('r_callCount').value) || 0;
  const emails = parseInt(document.getElementById('r_emailCount').value) || 0;

  const isWorkdayChecked = document.getElementById('r_chkWorkday').checked;
  const isWeekoffChecked = document.getElementById('r_chkWeekoff').checked;

  const workdayDays = parseInt(document.getElementById('r_daysWorkday').value) || 0;
  const weekoffDays = parseInt(document.getElementById('r_daysWeekoff').value) || 0;

  const dailyVolume = calls + (emails * (2 / 3));
  document.getElementById('r_total').value = dailyVolume.toFixed(2);

  if (!isWorkdayChecked && !isWeekoffChecked) {
    document.getElementById('r_payout').innerText = "₹ 0";
    document.getElementById('r_details').innerText = "Please check at least one OT option (Workday or Week Off).";
    triggerPayoutAnimation('r_resultBox', 'r_payout', 0);
    return;
  }

  let totalPayout = 0;
  let summaryNotes = [];

  // 1. Regular Workday OT Calculation
  if (isWorkdayChecked) {
    if (dailyVolume <= 45) {
      summaryNotes.push(`Workdays (${workdayDays}d): ₹0 (Daily volume ≤ 45 threshold)`);
    } else {
      const payablePerDay = dailyVolume - 45;
      const workdayPayout = payablePerDay * 65 * workdayDays;
      totalPayout += workdayPayout;
      summaryNotes.push(`Workdays (${workdayDays}d): ₹${workdayPayout.toFixed(2)} (${payablePerDay.toFixed(2)} extra units/day @ ₹65)`);
    }
  }

  // 2. 6th Day / Week Off Calculation
  if (isWeekoffChecked) {
    const weekoffPayout = dailyVolume * 65 * weekoffDays;
    totalPayout += weekoffPayout;
    summaryNotes.push(`Week Off (${weekoffDays}d): ₹${weekoffPayout.toFixed(2)} (${dailyVolume.toFixed(2)} units/day @ ₹65 from 1st chat)`);
  }

  document.getElementById('r_payout').innerText = "₹ " + totalPayout.toLocaleString('en-IN', { maximumFractionDigits: 2 });
  document.getElementById('r_details').innerText = summaryNotes.join(" | ");

  triggerPayoutAnimation('r_resultBox', 'r_payout', totalPayout);
}
</script>

</body>
</html>
