<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OT Calculator Hub</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #0b192c;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }
    .calculator-card {
      background-color: #1e293b;
      border: 2px solid #38bdf8;
      border-radius: 12px;
      padding: 25px;
      max-width: 460px;
      width: 100%;
      box-shadow: 0 8px 24px rgba(56, 189, 248, 0.2);
    }
    /* Tab Styling */
    .tab-container {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }
    .tab-btn {
      flex: 1;
      padding: 12px;
      background-color: #0f172a;
      color: #94a3b8;
      border: 1px solid #334155;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      text-align: center;
      transition: all 0.3s ease;
    }
    .tab-btn.active {
      background-color: #38bdf8;
      color: #0f172a;
      border-color: #38bdf8;
    }
    .tab-content {
      display: none;
    }
    .tab-content.active {
      display: block;
    }

    h2 {
      text-align: center;
      color: #38bdf8;
      margin-top: 0;
      text-transform: uppercase;
      letter-spacing: 1px;
      font-size: 1.3rem;
    }
    .subtitle {
      text-align: center;
      color: #cbd5e1;
      font-size: 0.85em;
      margin-bottom: 20px;
      font-weight: bold;
    }
    .form-group {
      margin-bottom: 15px;
    }
    label {
      display: block;
      margin-bottom: 6px;
      font-weight: 600;
      color: #e2e8f0;
      font-size: 0.9rem;
    }
    input[type="number"], select {
      width: 100%;
      padding: 10px;
      border-radius: 6px;
      border: 1px solid #475569;
      background-color: #0f172a;
      color: #fff;
      font-size: 0.95rem;
      box-sizing: border-box;
    }
    input[type="number"]:focus, select:focus {
      border-color: #38bdf8;
      outline: none;
    }
    input[readonly] {
      background-color: #1e293b;
      border-color: #38bdf8;
      color: #38bdf8;
      font-weight: bold;
    }
    .checkbox-group {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 10px;
    }
    .checkbox-group input {
      width: 18px;
      height: 18px;
      accent-color: #38bdf8;
    }
    .calc-btn {
      width: 100%;
      padding: 12px;
      background-color: #38bdf8;
      color: #0f172a;
      border: none;
      border-radius: 6px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      margin-top: 15px;
      transition: background 0.2s;
    }
    .calc-btn:hover {
      background-color: #0284c7;
      color: #ffffff;
    }
    .result-box {
      margin-top: 20px;
      padding: 15px;
      border-radius: 8px;
      background-color: #0f172a;
      text-align: center;
      border: 1px solid #334155;
    }
    .result-title {
      font-size: 0.85em;
      color: #94a3b8;
    }
    .result-amount {
      font-size: 1.8rem;
      font-weight: bold;
      color: #38bdf8;
      margin: 6px 0;
    }
    .result-reason {
      font-size: 0.8em;
      color: #cbd5e1;
    }
  </style>
</head>
<body>

<div class="calculator-card">
  <!-- Tab Navigation -->
  <div class="tab-container">
    <div class="tab-btn active" onclick="switchTab('bonanza')">OT Bonanza</div>
    <div class="tab-btn" onclick="switchTab('regular')">Regular OT</div>
  </div>

  <!-- OT BONANZA SECTION -->
  <div id="bonanzaTab" class="tab-content active">
    <h2>October OT Bonanza</h2>
    <div class="subtitle">STAY ACCURATE, BOOST CSAT, EARN BIG!</div>

    <div class="form-group">
      <label for="b_callCount">MTD Call/Chat Count:</label>
      <input type="number" id="b_callCount" placeholder="Enter chats/calls" min="0" oninput="updateTotal('b')">
    </div>

    <div class="form-group">
      <label for="b_emailCount">MTD Email Count (3 Emails = 2 Chats):</label>
      <input type="number" id="b_emailCount" placeholder="Enter emails" min="0" oninput="updateTotal('b')">
    </div>

    <div class="form-group">
      <label for="b_total">Total Equivalent Transactions (Auto):</label>
      <input type="number" id="b_total" placeholder="0" readonly>
    </div>

    <div class="form-group">
      <label for="b_csat">CSAT Percentage (%):</label>
      <input type="number" id="b_csat" placeholder="Min. CSAT required: 62%" min="0" max="100">
    </div>

    <div class="form-group checkbox-group">
      <input type="checkbox" id="b_unsavedError">
      <label for="b_unsavedError">More than 1 unsaved error</label>
    </div>

    <button class="calc-btn" onclick="calculateBonanza()">Calculate Bonanza Earnings</button>

    <div class="result-box">
      <div class="result-title">Estimated Bonanza Payout</div>
      <div class="result-amount" id="b_payout">₹ 0</div>
      <div class="result-reason" id="b_details">Enter metrics to calculate.</div>
    </div>
  </div>

  <!-- REGULAR OT SECTION -->
  <div id="regularTab" class="tab-content">
    <h2>Regular Overtime</h2>
    <div class="subtitle">STANDARD OT CALCULATOR</div>

    <div class="form-group">
      <label for="r_type">Select OT Shift Type:</label>
      <select id="r_type">
        <option value="workday">Regular Workday OT (45 Threshold)</option>
        <option value="weekoff">6th Day Working / Week Off (From 1st Chat)</option>
      </select>
    </div>

    <div class="form-group">
      <label for="r_callCount">Call/Chat Count:</label>
      <input type="number" id="r_callCount" placeholder="Enter chats/calls" min="0" oninput="updateTotal('r')">
    </div>

    <div class="form-group">
      <label for="r_emailCount">Email Count (3 Emails = 2 Chats):</label>
      <input type="number" id="r_emailCount" placeholder="Enter emails" min="0" oninput="updateTotal('r')">
    </div>

    <div class="form-group">
      <label for="r_total">Total Equivalent Transactions (Auto):</label>
      <input type="number" id="r_total" placeholder="0" readonly>
    </div>

    <button class="calc-btn" onclick="calculateRegular()">Calculate Regular OT</button>

    <div class="result-box">
      <div class="result-title">Estimated Regular OT Payout</div>
      <div class="result-amount" id="r_payout">₹ 0</div>
      <div class="result-reason" id="r_details">Enter transactions to calculate.</div>
    </div>
  </div>
</div>

<script>
// Switch between Tabs
function switchTab(tabName) {
  const tabs = document.querySelectorAll('.tab-btn');
  const contents = document.querySelectorAll('.tab-content');

  tabs.forEach(tab => tab.classList.remove('active'));
  contents.forEach(content => content.classList.remove('active'));

  if (tabName === 'bonanza') {
    tabs[0].classList.add('active');
    document.getElementById('bonanzaTab').classList.add('active');
  } else {
    tabs[1].classList.add('active');
    document.getElementById('regularTab').classList.add('active');
  }
}

// Auto Update Equivalent Sum
function updateTotal(prefix) {
  const calls = parseInt(document.getElementById(prefix + '_callCount').value) || 0;
  const emails = parseInt(document.getElementById(prefix + '_emailCount').value) || 0;
  
  const totalVolume = calls + (emails * (2 / 3));
  document.getElementById(prefix + '_total').value = totalVolume.toFixed(2);
}

// OT Bonanza Calculation (October Scheme)
function calculateBonanza() {
  const calls = parseInt(document.getElementById('b_callCount').value) || 0;
  const emails = parseInt(document.getElementById('b_emailCount').value) || 0;
  const csat = parseFloat(document.getElementById('b_csat').value) || 0;
  const hasUnsavedError = document.getElementById('b_unsavedError').checked;

  const totalVolume = calls + (emails * (2 / 3));
  document.getElementById('b_total').value = totalVolume.toFixed(2);

  const rateTier1 = 22400 / 1270; // ~17.638
  const rateTier2 = 35000 / 1340; // ~26.119
  const rateTier3 = 45000 / 1390; // ~32.374

  let appliedRate = 0;
  let totalPayout = 0;
  let calculationNote = "";

  const meetsRiderConditions = (csat >= 62) && (!hasUnsavedError);

  // Strict Threshold: 0 payout until meeting 1270 transactions
  if (totalVolume < 1270) {
    document.getElementById('b_payout').innerText = "₹ 0";
    document.getElementById('b_details').innerText = `₹0 Payout: Minimum 1270 transactions required to qualify for OT Bonanza (Current: ${totalVolume.toFixed(2)}).`;
    return;
  }

  if (meetsRiderConditions) {
    if (totalVolume >= 1390) {
      appliedRate = rateTier3;
      calculationNote = `Tier 3 rate applied (₹${appliedRate.toFixed(3)}/unit for ${totalVolume.toFixed(2)} transactions).`;
    } else if (totalVolume >= 1340) {
      appliedRate = rateTier2;
      calculationNote = `Tier 2 rate applied (₹${appliedRate.toFixed(3)}/unit for ${totalVolume.toFixed(2)} transactions).`;
    } else {
      appliedRate = rateTier1;
      calculationNote = `Tier 1 rate applied (₹${appliedRate.toFixed(3)}/unit for ${totalVolume.toFixed(2)} transactions).`;
    }
    totalPayout = totalVolume * appliedRate;
  } else {
    totalPayout = 0;
    let reasonText = [];
    if (csat < 62) reasonText.push("CSAT is below 62%");
    if (hasUnsavedError) reasonText.push("More than 1 unsaved error");
    
    calculationNote = `₹0 Payout: Criteria missed due to ${reasonText.join(" and ")}.`;
  }

  document.getElementById('b_payout').innerText = "₹ " + totalPayout.toLocaleString('en-IN', { maximumFractionDigits: 2 });
  document.getElementById('b_details').innerText = calculationNote;
}

// Regular OT Calculation
function calculateRegular() {
  const calls = parseInt(document.getElementById('r_callCount').value) || 0;
  const emails = parseInt(document.getElementById('r_emailCount').value) || 0;
  const otType = document.getElementById('r_type').value;

  const totalVolume = calls + (emails * (2 / 3));
  document.getElementById('r_total').value = totalVolume.toFixed(2);

  let totalPayout = 0;
  let calculationNote = "";

  if (otType === 'workday') {
    if (totalVolume <= 45) {
      totalPayout = 0;
      calculationNote = `No OT payout: Minimum threshold of 45 transactions not exceeded (Current: ${totalVolume.toFixed(2)}).`;
    } else {
      const payableTransactions = totalVolume - 45;
      totalPayout = payableTransactions * 65;
      calculationNote = `Regular Workday OT: Paid for ${payableTransactions.toFixed(2)} transactions (above 45 limit) @ ₹65/unit.`;
    }
  } else if (otType === 'weekoff') {
    totalPayout = totalVolume * 65;
    calculationNote = `6th Day / Week Off OT: Paid for all ${totalVolume.toFixed(2)} transactions @ ₹65/unit.`;
  }

  document.getElementById('r_payout').innerText = "₹ " + totalPayout.toLocaleString('en-IN', { maximumFractionDigits: 2 });
  document.getElementById('r_details').innerText = calculationNote;
}
</script>

</body>
</html>
